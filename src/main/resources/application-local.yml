spring:
  docker:
    compose:
      lifecycle-management: start_only
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: PixOptimizer
  datasource:
    url: jdbc:postgresql://localhost:5432/pixoptimizer
    username: postgres
    password: root
  session:
    jdbc:
      initialize-schema: always
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show-sql: false

application:
  jwtSecret: ${CARONTE_JWT_SECRET:my-secret-key}

management:
  endpoints:
    web:
      exposure:
        # In production use only 'health' and 'info'
        include: "*"
  endpoint:
    health:
      show-details: always